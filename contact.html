<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💎MAHIS - Contact</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar custom-navbar d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="index.html" style="text-shadow: white 1px 5px 2px;">
      <i class="fas fa-gem me-2" style="color:#d36a91;"></i> MAHIS
    </a>
    <div class="d-flex align-items-center">
      <a class="nav-link" href="about.html">À propos</a>
      <a class="nav-link" href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="container mt-5 pt-5">
    <div class="box">
      <h2 class="text-center mb-4">Contactez-nous</h2>
      <form class="needs-validation" novalidate>
        <div class="mb-3">
          <label class="form-label">Nom complet</label>
          <input type="text" class="form-control" placeholder="Votre nom" required>
          <div class="invalid-feedback">
            Veuillez saisir votre nom.
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Votre email" required>
          <div class="invalid-feedback">
            Veuillez saisir une adresse email valide.
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="Votre message..." required></textarea>
          <div class="invalid-feedback">
            Le message est obligatoire.
          </div>
        </div>
        <div class="d-flex justify-content-center">
          <button type="submit" class="btn btn-primary"
            style="border-color:#e8a8b8 ;  background-image: linear-gradient(to top,#d36a91,#e8a8b8,#e8a8b8)">Envoyer</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Footer -->
  <footer id="contact" class="n">
    <div class="container text-center">
      <p>&copy; 2025 MAHIS. Tous droits réservés.</p>
      <p>Contact : <a href="mailto:mahis@gmail.com">Mahis@gmail.com</a> | Tel : +212 6 12 34 56 78</p>

      <!-- Icônes réseaux sociaux -->
      <div class="social-icons mt-3">
        <a href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
        <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="#" target="_blank"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (() => {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')

      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>

</body>

</html>
