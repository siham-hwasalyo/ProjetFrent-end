<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHIS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login_inscription.css">
    <title> 💎MAHIS</title>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar custom-navbar d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="index.html" style="text-shadow: white 1px 5px 2px ;">
            <i class="fas fa-gem me-2" style="color:#d36a91;"></i> MAHIS
        </a>

    </nav>
    <!-- Formulaire d'inscription -->
    <div class="form-container">
        <h2>Inscription</h2>
        <form action="login.html" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="nom" class="form-label"> Prénom</label>
                    <input type="text" class="form-control" id="nom" placeholder="Entrez votre nom et prénom" required>
                    <div class="invalid-feedback">Champ obligatoire</div>
                </div>
                <div class="col-md-6">
                    <label for="username" class="form-label">Nom</label>
                    <input type="text" class="form-control" id="username" placeholder="Nom d'utilisateur" required>
                    <div class="invalid-feedback">Champ obligatoire</div>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Adresse mail</label>
                <input type="email" class="form-control" id="email" placeholder="Entrez votre email" required>
                <div class="invalid-feedback">Email non valide</div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="ville" class="form-label">Ville</label>
                    <input type="text" class="form-control" id="ville" placeholder="Votre ville" required>
                    <div class="invalid-feedback">Champ obligatoire</div>
                </div>
                <div class="col-md-6">
                    <label for="tel" class="form-label">Tél</label>
                    <input type="tel" class="form-control" id="tel" placeholder="Ex: +212 6 12 34 56 78" required>
                    <div class="invalid-feedback">Numéro non valide</div>
                </div>
            </div>

            <div class="mb-3">
                <label for="photo" class="form-label">Photo profil</label>
                <input type="file" class="form-control" id="photo" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary"><a href="login.html "
                    style="color: white !important;">Valider</a></button>
        </form>
        <p class="text-center mt-3">Déjà un compte ? <a href="login.html">Se connecter</a></p>
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Validation du formulaire -->
    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>

</html>
