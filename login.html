<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHIS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login_inscription.css">
    <title> 💎MAHIS</title>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar custom-navbar d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="index.html" style="text-shadow: white 1px 5px 2px ;">
            <i class="fas fa-gem me-2" style="color:#d36a91;"></i> MAHIS
        </a>
    </nav>
    <!-- Formulaire de connexion -->
    <div class="form-container">
        <h2>Se connecter</h2>
        <form action="home.html" method="post" class="needs-validation" novalidate>
            <!--email&nom-->
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur ou Email</label>
                <input type="text" class="form-control" id="username"
                    placeholder="Entrez votre nom d'utilisateur ou email" required>
                <div class="invalid-feedback">Champ obligatoire</div>
            </div>
            <!--password-->
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" placeholder="********" required>
                <div class="invalid-feedback">
                    Mot de passe obligatoire (8 caractères minimum)
                </div>
                <small class="form-text text-muted" style="color: gray !important;">Votre mot de passe doit contenir au
                    moins 8 caractères.</small>
            </div>
            <!--cofirmation de mot de passe-->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="********" required>
                <div class="invalid-feedback">
                    Confirmez votre mot de passe
                </div>
            </div>
            <!--se connecte-->
            <button type="submit" class="btn btn-primary"><a href="article.html" style="color:white !important ;">Se
                    connecter</a></button>
        </form>
        <!--s'insrie-->
        <p class="text-center mt-3">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
        <!--mot de passe oublie-->
        <p class="text-center mt-2"><a href="reset_password.html">Mot de passe oublié ?</a></p>
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Validation du formulaire -->
    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>

</html>
